<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cérebro</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--tx:#e6ebf5;--mu:#8d9ab3;--ac:#6ea8ff;--ok:#4cc38a;--av:#f2b84b;--rd:#ef6b6b}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 8px;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
.col{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{background:var(--card);border-radius:10px;padding:10px 12px}
.card b{display:block;margin-bottom:4px}.tag{font-size:12px;padding:1px 7px;border-radius:9px;background:#26304a;color:var(--mu)}
pre{white-space:pre-wrap;background:var(--card);padding:10px 12px;border-radius:10px;margin:0;font:13px/1.45 ui-monospace,Consolas,monospace;max-height:300px;overflow:auto}
.n{font-size:22px;font-weight:600}.novo{color:var(--av)}.andando{color:var(--ac)}.feito{color:var(--ok)}.devolvido{color:var(--rd)}
html[data-emb="1"] body{padding:8px}
</style></head><body>
<h1>Cérebro <span class="mu">memória unificada das IAs</span></h1>
<div class="mu" id="atual">carregando...</div>
<h2>Pedidos entre IAs</h2><div class="col" id="cont"></div><div class="col" id="ped" style="margin-top:10px"></div>
<h2>Handoffs (último estado de cada IA)</h2><div class="col" id="hand"></div>
<h2>Índice</h2><pre id="idx"></pre>
<script>
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function carregar(){
 try{const r=await (await fetch('/api/cerebro/indice')).json();
  document.getElementById('atual').textContent='Atualizado: '+(r.atualizado?new Date(r.atualizado*1000).toLocaleString('pt-BR'):'sem índice')+' · E:\\Cerebro';
  document.getElementById('cont').innerHTML=['novo','andando','feito','devolvido'].map(e=>'<div class="card"><span class="n '+e+'">'+r.contagem[e]+'</span><div class="mu">'+e+'</div></div>').join('');
  document.getElementById('ped').innerHTML=r.pedidos.slice().reverse().slice(0,24).map(p=>'<div class="card"><b>'+E(p.assunto)+'</b><span class="tag '+E(p.estado)+'">'+E(p.estado)+'</span> <span class="mu">'+E(p.de)+' → '+E(p.para)+'</span><div class="mu">'+E(p.atualizado)+'</div>'+(p.resultado?'<div>'+E(String(p.resultado).slice(0,200))+'</div>':'')+'</div>').join('')||'<div class="mu">Nenhum pedido ainda.</div>';
  document.getElementById('hand').innerHTML=r.handoffs.map(h=>'<div class="card"><b>'+E(h.ia)+'</b><div class="mu" style="white-space:pre-wrap">'+E(h.resumo)+'</div></div>').join('')||'<div class="mu">Nenhum handoff ainda.</div>';
  document.getElementById('idx').textContent=r.indice;
 }catch(e){document.getElementById('atual').textContent='Falha ao ler o Cérebro: '+e}
}
if(window.top!==window.self)document.documentElement.setAttribute('data-emb','1');
carregar();setInterval(carregar,15000);
</script></body></html>
