<!doctype html>
<html lang="pt-BR">
<head><script>/* B.R.A.N.I: o servidor exige X-Braniac em todo POST */var _f=window.fetch;window.fetch=function(u,o){if(o&&o.method==="POST")o.headers=Object.assign({"X-Braniac":"1"},o.headers||{});return _f(u,o)};</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
/* Tela de voz: anel de luz ambar na sala escura (16/11/2026: mesma forma da esfera da Alma). Acende quando acorda, ondula com a sua voz, pulsa com a dele. */
:root{--sala:#1E1412;--banco:#281B18;--linha:#3A2A25;--papel:#EDE6DA;--prata:#8E8A84;--ambar:#F2A541;--perigo:#D94A38}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sala);color:var(--papel);font:400 15px/1.5 "Archivo",system-ui,"Segoe UI",sans-serif}
:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
#lente{position:fixed;inset:0;width:100%;height:100%}
#topo{position:absolute;top:0;left:0;right:0;display:flex;align-items:baseline;gap:12px;padding:18px 22px;z-index:2}
#topo h1{margin:0;font-weight:700;font-stretch:125%;font-size:19px}
#topo span{margin-left:auto;color:var(--prata);font-size:13px}
#selo{display:none;position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:3;color:var(--ambar);border:1px solid var(--ambar);border-radius:999px;padding:4px 14px;font-size:13px;white-space:nowrap}
#selo.on{display:block}
#rotulo{position:absolute;left:0;right:0;text-align:center;z-index:2;pointer-events:none}
#t1{display:block;font-weight:600;font-stretch:118%;font-size:24px}
#t2{display:block;color:var(--prata);font-size:14px;margin-top:2px}
#conversa{position:absolute;left:50%;transform:translateX(-50%);width:min(640px,92%);overflow-y:auto;z-index:2;
  display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--linha) transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 26%);mask-image:linear-gradient(to bottom,transparent,#000 26%)}
.m{max-width:88%;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.j{align-self:flex-start;padding-left:12px;border-left:2px solid var(--linha)}
.u{align-self:flex-end;background:var(--banco);border-radius:6px;padding:7px 12px}
.s{align-self:center;color:var(--prata);font-size:12.5px}
#botoes{position:absolute;left:0;right:0;bottom:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px;z-index:2}
button{font:inherit;font-size:13.5px;color:var(--papel);cursor:pointer;background:rgba(40,27,24,.85);border:1px solid var(--linha);border-radius:6px;padding:7px 12px}
button:hover{border-color:var(--prata)}
button.forte{border-color:var(--ambar);color:var(--ambar)}
#menuMudo{display:none;position:absolute;bottom:66px;left:50%;transform:translateX(-50%);z-index:4;background:var(--banco);border:1px solid var(--linha);
  border-radius:8px;padding:12px;flex-wrap:wrap;gap:8px;justify-content:center;width:min(420px,92%)}
#menuMudo.on{display:flex}
#menuMudo label{width:100%;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--prata);cursor:pointer}
#menuMudo input{accent-color:var(--ambar);margin-top:3px}
#temp{position:absolute;left:22px;bottom:20px;z-index:2;display:flex;gap:14px;font-size:12.5px;color:var(--prata);font-variant-numeric:tabular-nums}
#temp b{display:block;font-weight:600;font-stretch:118%;font-size:17px;color:var(--papel)}
#temp .q b{color:var(--ambar)}#temp .f b{color:var(--perigo)}
@media(max-width:700px){#temp{left:12px;bottom:60px}}
</style>
</head>
<body>
<canvas id="lente" aria-hidden="true"></canvas>
<div id="topo"><h1>Jarvis</h1><span id="estado">conectando</span></div>
<div id="selo" role="status"></div>
<div id="rotulo"><span id="t1">Dormindo</span><span id="t2">Diga “Jarvis, tá acordado?”</span></div>
<div id="conversa" aria-live="polite"></div>
<div id="menuMudo">
  <button data-min="10">Por 10 min</button>
  <button data-min="60">Por 1 hora</button>
  <button data-min="0">Até eu voltar</button>
  <label title="Áudios para clientes e hóspedes não são afetados."><input type="checkbox" id="mWpp"> Silenciado, também não me mandar áudio no WhatsApp</label>
</div>
<div id="temp" aria-label="Temperatura do notebook"></div>
<div id="botoes">
  <button id="bMudo" class="forte" title="Atalho: tecla M">Silenciar (M)</button>
  <button id="bAcordar">Acordar</button>
  <button id="bDescansar">Descansar</button>
  <button id="bDesligar">Desligar microfone</button>
  <button id="bMinimizar" title="Fica só o orbe pequeno, que você arrasta pela tela">Minimizar</button>
</div>
<script>
const $ = s => document.querySelector(s);
const cv = $('#lente'), c = cv.getContext('2d');
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0;
function medir(){ const D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*D; cv.height = H*D; c.setTransform(D,0,0,D,0,0); }
addEventListener('resize', medir); medir();

const dados = {estado:'dormindo', atividade:'idle', entrada:0, fala:0, historico:[]};
const v = {ab:.18, luz:.3, ent:0, fala:0, giro:0};
const N = 9;                                   // laminas do diafragma

function desenhar(agora){
  const t = agora/1000, k = x => Math.min(1, x);
  const desligado = dados.estado === 'parada', acordado = dados.estado === 'acordado';
  v.ent  += (dados.entrada - v.ent)  * (dados.entrada > v.ent ? .45 : .08);
  v.fala += (dados.fala    - v.fala) * (dados.fala    > v.fala ? .5  : .1);
  const som = Math.max(dados.atividade === 'ouvindo' ? v.ent : 0, dados.atividade === 'falando' ? v.fala : 0);
  const respira = calmo ? 0 : .03*Math.sin(t*(acordado ? 1.6 : .7));
  const alvoAb = desligado ? .04 : acordado ? .55 + .32*k(som*1.6) + respira : .16 + respira;
  const alvoLuz = desligado ? .08 : acordado ? .55 + .45*k(som*1.6) : .28;
  v.ab += (alvoAb - v.ab) * .09; v.luz += (alvoLuz - v.luz) * .08;
  if(!calmo) v.giro += (dados.atividade === 'pensando' ? .018 : .0012);

  const R = Math.max(60, Math.min(W*.36, H*.27, (H - 390)/2)), cx = W/2, cy = 100 + R + 26;   // espaco no topo para o aviso de silencio
  const rot = $('#rotulo'), conv = $('#conversa');
  rot.style.top = (cy + R + 30) + 'px';
  conv.style.top = (cy + R + 30 + rot.offsetHeight + 14) + 'px';      // a conversa ocupa o espaco entre o rotulo e os botoes
  conv.style.bottom = ($('#botoes').offsetHeight + 28) + 'px';
  $('#menuMudo').style.bottom = ($('#botoes').offsetHeight + 24) + 'px';
  c.clearRect(0, 0, W, H);

  // anel de luz (16/11, pedido do Dono: a mesma forma da esfera da Alma; o Jarvis continua ambar para dar para saber quem fala)
  const pensando = dados.atividade === 'pensando';
  const amp = desligado ? 0 : dados.atividade === 'ouvindo' ? .03 + .10*k(v.ent*1.6) : dados.atividade === 'falando' ? .015 + .06*k(v.fala*1.6) : .010;
  if(!calmo && !desligado) v.fase = (v.fase || 0) + .006 + (acordado ? .010 : 0) + .05*k(som) + (pensando ? .03 : 0);
  const fase = v.fase || 0, rr = R*.86;
  const cor  = al => desligado ? `rgba(150,146,140,${al})` : `rgba(242,165,65,${al})`;
  const cor2 = al => desligado ? `rgba(196,192,186,${al})` : `rgba(255,214,140,${al})`;
  const caminho = () => { c.beginPath();
    for(let i = 0; i <= 72; i++){ const th = i*6.2832/72, q = rr*(1 + amp*Math.sin(3*th + fase) + amp*.6*Math.sin(5*th - 1.7*fase));
      const x = cx + q*Math.cos(th), y = cy + q*Math.sin(th); i ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.closePath(); };
  const halo = c.createRadialGradient(cx, cy, rr*.5, cx, cy, rr*1.9);
  halo.addColorStop(0, cor(0)); halo.addColorStop(.44, cor(.20*v.luz)); halo.addColorStop(1, cor(0));
  c.fillStyle = halo; c.fillRect(0, 0, W, H);
  c.save(); c.globalCompositeOperation = 'lighter'; c.lineJoin = 'round';
  let traco = cor(.9);
  if(c.createConicGradient){                     // trechos mais acesos que giram; pensando = um arco forte correndo o anel
    traco = c.createConicGradient(fase*(pensando ? 2.2 : .65), cx, cy);
    (pensando ? [[0, cor2(1)], [.12, cor(.22)], [.5, cor(.10)], [.88, cor(.22)], [1, cor2(1)]]
              : [[0, cor2(.95)], [.25, cor(.35)], [.5, cor2(.95)], [.75, cor(.35)], [1, cor2(.95)]]).forEach(x => traco.addColorStop(x[0], x[1]));
  }
  const larg = Math.max(3, R*(.035 + .05*k(som*1.6)));
  caminho(); c.shadowColor = cor(.9); c.shadowBlur = R*.38; c.strokeStyle = cor(.10 + .35*v.luz); c.lineWidth = larg*2.4; c.stroke();
  caminho(); c.shadowBlur = R*.12; c.globalAlpha = Math.min(1, .35 + v.luz); c.strokeStyle = traco; c.lineWidth = larg; c.stroke();
  caminho(); c.shadowBlur = 0; c.globalAlpha = Math.min(1, .2 + v.luz)*.8; c.strokeStyle = 'rgba(255,246,228,.9)'; c.lineWidth = Math.max(1, larg*.28); c.stroke();
  c.restore();
  requestAnimationFrame(desenhar);
}
requestAnimationFrame(desenhar);

// ---------- textos e botoes ----------
const textos = {
  acordado:['Acordado', 'Estou ouvindo. Diga “pode descansar, Jarvis” quando terminar.'],
  dormindo:['Dormindo', 'Diga “Jarvis, tá acordado?”'],
  parada:['Microfone desligado', 'O Jarvis não está ouvindo.']
};
const atividades = {ouvindo:'Ouvindo você', pensando:'Pensando', falando:'Falando'};
async function acao(a){ try{ await fetch('/api/escuta-acao', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({acao:a})}); }catch(e){} }
$('#bAcordar').onclick = () => acao('acordar');
$('#bDescansar').onclick = () => acao('descansar');
$('#bDesligar').onclick = () => acao($('#bDesligar').dataset.e === 'parada' ? 'ligar' : 'desligar');
$('#bMinimizar').onclick = async () => {
  try{ await fetch('/api/orbe', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({acao:'mini'})}); }catch(e){}
  window.close();
  setTimeout(() => { $('#t2').textContent = 'O orbe pequeno já está na tela. Pode fechar esta janela.'; }, 400);
};

// ---------- mudo: sem voz no alto-falante, o texto continua ----------
let mudoAtual = {mudo:false};
async function mudoApi(corpo){
  try{ const r = await fetch('/api/mudo', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo)}); pintarMudo(await r.json()); }
  catch(e){ $('#estado').textContent = 'não consegui silenciar: sem conexão com o Braniac'; }
}
function pintarMudo(m){
  if(!m) return; mudoAtual = m;
  const selo = $('#selo');
  selo.className = m.mudo ? 'on' : '';
  selo.textContent = m.mudo ? ('Silenciado ' + (m.ate_desmutar ? 'até você voltar' : 'por mais ' + m.restante_min + ' min') + (m.whatsapp_usuarios ? ', sem áudio no WhatsApp' : '') + '. O texto continua aparecendo.') : '';
  $('#bMudo').textContent = m.mudo ? 'Voltar a falar (M)' : 'Silenciar (M)';
  if(document.activeElement !== $('#mWpp')) $('#mWpp').checked = !!m.whatsapp_usuarios;
}
function alternarMudo(rapido){
  if(mudoAtual.mudo){ $('#menuMudo').className = ''; return mudoApi({acao:'desmutar'}); }
  if(rapido) return mudoApi({acao:'mutar'});
  $('#menuMudo').classList.toggle('on');
}
$('#bMudo').onclick = () => alternarMudo(false);
document.querySelectorAll('#menuMudo button').forEach(b => b.onclick = () => { $('#menuMudo').className = ''; mudoApi({acao:'mutar', minutos:+b.dataset.min}); });
$('#mWpp').onchange = e => mudoApi({whatsapp_usuarios: e.target.checked});
addEventListener('keydown', e => {
  if((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.altKey && !e.metaKey && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); alternarMudo(true); }
  if(e.key === 'Escape') $('#menuMudo').className = '';
});

// 'me mostra' por voz (15/11): o Jarvis pede uma tela; dentro do B.R.A.N.I.A.C 1 troca a aba, sozinha troca a pagina. Uma vez por id.
let telaVista=0;
function telaPedida(t){if(!t||t.id<=telaVista)return;telaVista=t.id;try{if(parent!==window&&parent.abrirTela){parent.abrirTela(t.url);return}}catch(e){}location.href=t.url}
let vistos = -1;
async function atualizar(){
  try{
    const d = await (await fetch('/api/escuta-estado')).json();
    Object.assign(dados, d);
    telaPedida(d.tela);
    pintarMudo(d.mudo);
    const [a, b] = textos[d.estado] || textos.dormindo;
    const ativ = d.estado === 'acordado' && atividades[d.atividade];
    $('#t1').textContent = ativ || a;
    $('#t2').textContent = ativ ? '' : b;
    $('#estado').textContent = (textos[d.estado] || [d.estado])[0].toLowerCase();
    $('#bDesligar').textContent = d.estado === 'parada' ? 'Ligar microfone' : 'Desligar microfone';
    $('#bDesligar').dataset.e = d.estado;
    if(d.historico.length !== vistos){
      const f = $('#conversa'); f.innerHTML = '';
      for(const h of d.historico.slice(-12)){
        const div = document.createElement('div');
        div.className = 'm ' + (h[0] === 'u' ? 'u' : h[0] === 'j' ? 'j' : 's');
        div.textContent = h[1]; f.appendChild(div);
      }
      vistos = d.historico.length; requestAnimationFrame(() => { f.scrollTop = f.scrollHeight; });   // depois do layout: a ultima fala fica visivel
    }
  }catch(e){ $('#estado').textContent = 'sem conexão com o Braniac'; dados.estado = 'parada'; dados.atividade = 'idle'; }
}
atualizar(); setInterval(atualizar, 100);
async function temperatura(){
  try{
    const t = await (await fetch('/api/termico')).json();
    if(!t.pronto) return;
    const g = t.gpu_c, cls = v => v >= 80 ? 'f' : v >= 70 ? 'q' : '';
    const item = (rot, val, c) => `<div class="${c}"><b>${val}</b>${rot}</div>`;
    $('#temp').innerHTML = (g ? item('placa de vídeo', Math.round(g) + '°', cls(g)) : '')
      + (t.cpu_c ? item('processador', Math.round(t.cpu_c) + '°', cls(t.cpu_c - 10)) : item('processador', Math.round(t.cpu_pct) + '%', t.cpu_pct >= 90 ? 'q' : ''))
      + item('memória', Math.round(t.ram_pct) + '%', t.ram_pct >= 90 ? 'q' : '');
  }catch(e){}
}
temperatura(); setInterval(temperatura, 10000);
</script>
</body>
</html>
