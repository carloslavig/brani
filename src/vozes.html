<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vozes</title>
<style>body{font:18px/1.5 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#11151a;color:#e6e9ed}
a{color:#7db7ff}h1{font-size:1.7rem;margin:.4rem 0}h2{font-size:1.25rem;margin:1.4rem 0 .3rem}
input,button,select{font:inherit;color:inherit;background:#1a2028;border:1px solid #2a323c;border-radius:6px;padding:.6rem .9rem}
button{cursor:pointer}button:disabled{opacity:.6}:focus-visible{outline:3px solid #7db7ff;outline-offset:2px}
summary{cursor:pointer;padding:.5rem 0}progress{width:100%;height:1.2rem}
.dica{font-size:.9em;color:#8b96a3}.grande{font-size:1.35rem;font-weight:600;margin:.3rem 0}.pre{white-space:pre-wrap}
.caixa button,.caixa select{margin:.3rem .3rem 0 0;max-width:100%}.caixa{background:#1a2028;border:1px solid #2a323c;border-radius:6px;padding:.8rem 1rem;margin:.6rem 0;overflow-wrap:anywhere}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.6rem}.grade .caixa{margin:0}
.ok{color:#6fd08c}.ruim{color:#ff8a80}.aten{color:#e6c35c}#st{color:#e6c35c;min-height:1.5em}</style></head><body>
<p><a href="/">← Início</a></p>
<h1>Vozes</h1>
<p id="st" role="status">Carregando…</p>
<h2>A voz de cada agente</h2>
<div id="agentes" class="grade"></div>
<p class="dica">Escolha uma voz na lista e toque em um dos botões. A segunda e a terceira opção só falam quando a principal falha. Neste Braniac só as vozes do Gemini falam de verdade; as outras ficam guardadas e a fala cai na voz de sempre.</p>
<h2>Vozes que existem</h2>
<div id="motores"></div>
<script>
const $=id=>document.getElementById(id);
// todo texto entra por textContent: o que vem da API pode ter sido escrito por terceiros
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const json=async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw {erro:j.erro};return j;};
const pega=async u=>json(await fetch(u));
const manda=async(u,c)=>json(await fetch(u,{method:'POST',headers:{'X-Braniac':'1','Content-Type':'application/json'},body:JSON.stringify(c)}));
let tocando=null;
async function ouvir(a,b){
  b.disabled=true;b.textContent='Preparando…';
  try{
    const r=await fetch('/api/voz',{method:'POST',headers:{'X-Braniac':'1','Content-Type':'application/json'},body:JSON.stringify({texto:'Olá. Aqui é '+String(a.nome||a.id).replace(/\s*\(.*\)/,'')+'. Esta é a minha voz.',agente:a.id})});
    if(!r.ok)throw 0;
    if(tocando)tocando.pause();
    tocando=new Audio(URL.createObjectURL(await r.blob()));await tocando.play();
    $('st').textContent='';
  }catch{$('st').textContent='Não consegui falar agora.';}
  b.disabled=false;b.textContent='▶ Ouvir';
}
async function mudar(corpo,b){
  b.disabled=true;
  try{await manda('/api/vozes',corpo);await carregar();$('st').textContent='Pronto, guardei.';}
  catch(e){$('st').textContent='Não deu: '+((e&&e.erro)||'o Braniac não respondeu');b.disabled=false;}
}
const POS=['Segunda opção','Terceira opção'];
function agente(a,motores){
  const c=el('div','caixa'),e=(a.escolha&&typeof a.escolha==='object')?a.escolha:{};
  const nomeMotor=id=>(motores.find(m=>m.id===id)||{}).nome||id;
  c.append(el('strong','',a.nome||a.id));
  const voz=e.motor?nomeMotor(e.motor)+((e.vozes&&e.vozes[e.motor])?' · '+e.vozes[e.motor]:''):'a de sempre (nenhuma escolhida)';
  c.append(el('div','','Voz: '+voz));
  (Array.isArray(e.reservas)?e.reservas:[]).slice(0,2).forEach((r,i)=>{
    const l=el('div','dica',POS[i]+': '+[nomeMotor(r.motor),r.voz].filter(Boolean).join(' · ')+' '),t=el('button','','Tirar');
    t.type='button';t.setAttribute('aria-label','Tirar a '+POS[i].toLowerCase()+' de '+(a.nome||a.id));
    t.onclick=()=>mudar({acao:'tirar_reserva',agente:a.id,posicao:i+2},t);l.append(t);c.append(l);
  });
  if(a.so_genero)c.append(el('div','dica',a.so_genero==='F'?'Só voz feminina':'Só voz masculina'));
  const b=el('button','','▶ Ouvir');b.type='button';b.setAttribute('aria-label','Ouvir a voz de '+(a.nome||a.id));b.onclick=()=>ouvir(a,b);
  c.append(b);
  // so voz que da para escolher: motor ligado, voz instalada e do genero que o agente aceita
  const sel=el('select');sel.setAttribute('aria-label','Voz para '+(a.nome||a.id));
  motores.filter(m=>!m.lento).forEach(m=>(Array.isArray(m.vozes)?m.vozes:[]).filter(v=>v.instalada!==false&&(!a.so_genero||v.genero===a.so_genero)).forEach(v=>{
    const o=el('option','',(m.nome||m.id)+' · '+(v.nome||v.id));o.value=JSON.stringify([m.id,v.id]);sel.append(o);}));
  if(sel.options.length){
    c.append(el('div','dica','Trocar a voz:'),sel);
    ['Usar como principal','Usar como segunda opção','Usar como terceira opção'].forEach((rot,i)=>{
      const x=el('button','',rot);x.type='button';
      x.onclick=()=>{const [motor,voz]=JSON.parse(sel.value);mudar({acao:'escolher',agente:a.id,motor,voz,posicao:i+1},x);};
      c.append(x);});
  }
  return c;
}
function motor(m){
  const d=el('details','caixa'),vs=Array.isArray(m.vozes)?m.vozes:[];
  d.append(el('summary','',(m.nome||m.id)+' — '+vs.length+' voz(es)'+(m.lento?' (desligado: demora demais)':'')));
  if(m.onde)d.append(el('p','dica',m.onde));
  const ul=el('ul');
  vs.forEach(v=>ul.append(el('li','',[v.nome||v.id,v.genero==='F'?'feminina':v.genero==='M'?'masculina':'',v.idioma,v.instalada===false?'não instalada':''].filter(Boolean).join(' · '))));
  d.append(vs.length?ul:el('p','dica','Nada por aqui ainda'));
  return d;
}
async function carregar(){
  try{
    const c=(await pega('/api/vozes')).catalogo||{},ms=Array.isArray(c.motores)?c.motores:[],ags=Array.isArray(c.agentes)?c.agentes:[];
    $('agentes').replaceChildren(...ags.map(a=>agente(a,ms)));
    $('motores').replaceChildren(...ms.map(motor));
    $('st').textContent=ags.length||ms.length?'':'Nada por aqui ainda';
  }catch{$('st').textContent='O Braniac não respondeu';}
}
carregar();
</script>
</body></html>
